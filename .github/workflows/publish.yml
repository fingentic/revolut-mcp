# =============================================================================
# Publish — runs on every push to master.
# 1. version : compute the release version with GitVersion
# 2. test    : run the unit suite across Node 18/20/22/24
# 3. npm     : pack & publish to npm (version = majorMinorPatch, 3-part SemVer)
# 4. docker  : build & push a multi-arch image to GHCR (tagged with both
#              majorMinorPatch and the 4-part assemblySemVer)
# 5. registry: publish server.json to the MCP registry (after npm succeeds)
# 6. release : create the vX.Y.Z git tag + GitHub release
#
# Authentication (no long-lived secrets are stored in this repository):
#   npm          Trusted publishing over OIDC. npm tokens that can publish now
#                expire after at most 90 days, so a stored NPM_TOKEN breaks on a
#                schedule; OIDC mints a short-lived credential per run instead.
#                One-time setup on npmjs.com, for the package: Settings ->
#                Trusted publishing -> GitHub Actions ->
#                  organization/user: fingentic
#                  repository:        revolut-mcp
#                  workflow filename: publish.yml
#                Needs npm >= 11.5.1 (Node 24 ships it) and `id-token: write`.
#                package.json `repository.url` must match this repository.
#   MCP registry GitHub OIDC (`id-token: write`); proves the
#                io.github.fingentic namespace.
#   GHCR/release The built-in GITHUB_TOKEN (see each job's `permissions`).
# =============================================================================
name: Publish

on:
  push:
    branches:
      - master

# Least privilege by default; jobs that need more declare it themselves.
permissions:
  contents: read

jobs:
  version:
    name: GitVersion
    runs-on: ubuntu-latest
    outputs:
      majorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}
      assemblySemVer: ${{ steps.gitversion.outputs.assemblySemVer }}
      major: ${{ steps.gitversion.outputs.major }}
      minor: ${{ steps.gitversion.outputs.minor }}
      semVer: ${{ steps.gitversion.outputs.semVer }}
      should_publish: ${{ github.ref == 'refs/heads/master' && github.event_name == 'push' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: "6.x"

      # GitVersion.yml in the repository root is picked up automatically.
      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0

      - name: Display resolved version
        run: |
          echo "SemVer:          ${{ steps.gitversion.outputs.semVer }}"
          echo "MajorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}"
          echo "AssemblySemVer:  ${{ steps.gitversion.outputs.assemblySemVer }}"

  test:
    name: Unit tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: version
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22", "24"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [version, test]
    if: needs.version.outputs.should_publish == 'true'
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC); no NPM_TOKEN is used
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # No dependency cache in the job that holds an OIDC token.
          package-manager-cache: false

      - name: Check npm supports trusted publishing
        run: |
          NPM_VERSION="$(npm --version)"
          echo "node $(node --version), npm ${NPM_VERSION}"
          if ! printf '11.5.1\n%s\n' "${NPM_VERSION}" | sort -V -C; then
            echo "::error::npm ${NPM_VERSION} is too old for trusted publishing (needs >= 11.5.1)"
            exit 1
          fi

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Set package version
        run: npm version "${{ needs.version.outputs.majorMinorPatch }}" --no-git-tag-version --allow-same-version

      - name: Publish (skip if version already exists)
        run: |
          VERSION="${{ needs.version.outputs.majorMinorPatch }}"
          if npm view "@jeff-nasseri/revolut-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "@jeff-nasseri/revolut-mcp@${VERSION} already published — skipping."
          else
            npm publish --access public
          fi

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: [version, test]
    if: needs.version.outputs.should_publish == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.version.outputs.majorMinorPatch }}
            type=raw,value=${{ needs.version.outputs.assemblySemVer }}
            type=raw,value=${{ needs.version.outputs.major }}.${{ needs.version.outputs.minor }}
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-mcp-registry:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    needs: [version, npm]
    # Only after npm publish succeeds — the registry validates the npm package
    # (and its mcpName field) for the version referenced in server.json.
    if: needs.version.outputs.should_publish == 'true' && needs.npm.result == 'success'
    permissions:
      id-token: write # GitHub OIDC — proves ownership of the io.github.fingentic namespace
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Download mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz"
          tar xf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher

      - name: Sync server.json version to the published version
        run: |
          VERSION="${{ needs.version.outputs.majorMinorPatch }}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/g" server.json
          cat server.json

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish

  create-release:
    name: Tag and release
    runs-on: ubuntu-latest
    needs: [version, npm, docker]
    if: always() && needs.version.outputs.should_publish == 'true' && needs.npm.result == 'success' && needs.docker.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Create and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="v${{ needs.version.outputs.majorMinorPatch }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.majorMinorPatch }}
          name: Release v${{ needs.version.outputs.majorMinorPatch }}
          body: |
            ## Release v${{ needs.version.outputs.majorMinorPatch }}

            Automatically published by GitHub Actions.

            - **npm:** `@jeff-nasseri/revolut-mcp@${{ needs.version.outputs.majorMinorPatch }}`
            - **Docker:** `ghcr.io/${{ github.repository }}:${{ needs.version.outputs.majorMinorPatch }}`
            - **Commit:** ${{ github.sha }}
          draft: false
          prerelease: false
